[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Search Console first got /sitemap.xml; the Astro sitemap integration writes /sitemap-index.xml.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

# Common misspelling of llms.txt
[[redirects]]
  from = "/llm.txt"
  to = "/llms.txt"
  status = 301
